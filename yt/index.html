<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Cat Browser</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif;
      background: #f7f7f8;
      color: #222;
    }

    .browser-bar {
      height: 58px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: rgba(255,255,255,.97);
      border-bottom: 1px solid #e5e5e5;
    }

    .nav-buttons {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    button {
      width: 36px;
      height: 36px;
      border: 0;
      background: transparent;
      border-radius: 9px;
      font-size: 20px;
      cursor: pointer;
    }

    button:hover {
      background: #eeeeef;
    }

    .url {
      min-width: 0;
      flex: 1;
      height: 38px;
      border: 1px solid #ddd;
      border-radius: 11px;
      padding: 0 13px;
      font-size: 14px;
      outline: none;
      background: #f5f5f6;
    }

    .home {
      min-height: calc(100dvh - 58px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      padding-bottom: 80px;
    }

    .logo {
      font-size: clamp(28px, 8vw, 36px);
      font-weight: 600;
      letter-spacing: -1px;
      margin-bottom: 24px;
    }

    .search {
      width: min(600px, 100%);
      height: 48px;
      border: 1px solid #ddd;
      border-radius: 24px;
      padding: 0 19px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    .cat {
      width: 170px;
      height: 120px;
      object-fit: cover;
      border-radius: 14px;
      margin-top: 32px;
      box-shadow: 0 5px 20px rgba(0,0,0,.12);
    }

    .yt-link {
      margin-top: 25px;
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }

    .yt-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .browser-bar {
        height: 54px;
        padding: 7px 8px;
        gap: 4px;
      }

      button {
        width: 32px;
        height: 36px;
        font-size: 18px;
      }

      .home {
        min-height: calc(100dvh - 54px);
        padding: 20px 18px 90px;
      }

      .search {
        height: 50px;
      }

      .cat {
        width: 150px;
        height: 105px;
        margin-top: 28px;
      }
    }

    @media (prefers-color-scheme: dark) {
      html, body {
        background: #111;
        color: #eee;
      }

      .browser-bar {
        background: #191919;
        border-color: #333;
      }

      .url {
        background: #222;
        border-color: #3a3a3a;
        color: #eee;
      }

      .search {
        background: #1e1e1e;
        border-color: #333;
        color: #eee;
      }

      .yt-link {
        color: #aaa;
      }
    }
  </style>
</head>

<body>

  <div class="browser-bar">
    <div class="nav-buttons">
      <button onclick="history.back()" aria-label="Back">‹</button>
      <button onclick="history.forward()" aria-label="Forward">›</button>
      <button onclick="location.reload()" aria-label="Reload">↻</button>
    </div>

    <input
      class="url"
      value="cat-browser"
      aria-label="Address"
      onkeydown="addressKey(event)"
    >
  </div>

  <main class="home">

    <div class="logo">Cat Browser</div>

    <form onsubmit="searchWeb(event)">
      <input
        class="search"
        id="search"
        type="search"
        placeholder="Search the web..."
        autocomplete="off"
      >
    </form>

    <img
      class="cat"
      src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif"
      alt="Funny cat GIF"
    >

    <a class="yt-link" href="/yt/">
      YouTube
    </a>

  </main>

  <script>
    function searchWeb(event) {
      event.preventDefault();

      const query = document
        .getElementById("search")
        .value
        .trim();

      if (!query) return;

      window.location.href =
        "https://www.google.com/search?q=" +
        encodeURIComponent(query);
    }

    function addressKey(event) {
      if (event.key !== "Enter") return;

      const value = event.target.value.trim();

      if (value === "/yt" || value === "/yt/") {
        window.location.href = "/yt/";
      }
    }
  </script>

</body>
</html>
